# CI (plan T1.7): the `rust` job gates code (fmt, clippy, tests, and
# the T1.6 contract-drift check); the `data` job gates the dataset
# (`mongil-build validate` + gate G9 snapshot immutability). The
# `site` job (plan T3.10) builds the whole site and runs the dist
# checks; the `preview` job deploys each PR to its own Cloudflare
# Pages branch and posts the URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Contract types cannot drift from Rust (plan T1.6 acceptance b)
        run: git diff --exit-code site/src/types/contract

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Validate the dataset (plan §B.7 gates)
        run: cargo run --quiet -p mongil-build -- validate --data data --site site
      - name: Accuracy tripwire (T4.5 — surfaced, not blocking; the lane classifier enforces it)
        run: |
          if cargo run --quiet -p mongil-build -- tripwire --data data; then
            echo "tripwire: clear"
          else
            echo "::warning::tripwire TRIPPED — the auto lane is closed until the errata are reviewed (T4.5)"
          fi
      - name: G9 — committed snapshots are immutable
        run: |
          changed="$(git diff --diff-filter=MDR --name-only origin/main -- data/snapshots/)"
          if [ -n "$changed" ]; then
            echo "G9: committed snapshots were modified, deleted or renamed:"
            echo "$changed"
            exit 1
          fi
          echo "G9: no committed snapshot modified or deleted"
      - name: G9 — method files are immutable once launched
        run: |
          if [ -f data/ops/autodeploy.toml ] && grep -q 'launch_date' data/ops/autodeploy.toml; then
            changed="$(git diff --diff-filter=MDR --name-only origin/main -- 'data/method/v*.toml')"
            if [ -n "$changed" ]; then
              echo "G9: method files changed after launch:"
              echo "$changed"
              exit 1
            fi
            echo "G9: method files unchanged since launch"
          else
            echo "G9: launch_date not set yet — the method-file half of G9 is dormant"
          fi

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Emit + render PNGs
        run: |
          cargo run --quiet -p mongil-build -- emit --data data --out site/src/generated
          cargo run --quiet -p mongil-build -- png --data data --out site/public/img/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site
        working-directory: site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Dist checks (G12 + G14, no allowances since P4)
        run: node site/scripts/check-dist.mjs --dist site/dist --data data

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Emit + render PNGs
        run: |
          cargo run --quiet -p mongil-build -- emit --data data --out site/src/generated
          cargo run --quiet -p mongil-build -- png --data data --out site/public/img/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site
        working-directory: site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Deploy the PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site/dist --project-name stardivemeta --branch "pr-${{ github.event.pull_request.number }}"
      - name: Post the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${context.issue.number}.stardivemeta.pages.dev`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${url}`,
            });
