# Roster — 30 characters: the 29 of the 2026-10-29 dataset, plus M.A.D added in v1.5.
# Source: docs/inputs/mongil-tier-list-consensus-2026-10-29.md (Kaiden
# character list, last updated Oct 19, 2026).
# released_on (T2.8, merged in sweep 2026-10-29T2105-sweep-pm from
# banners-note.md): set only where two independent sources give the
# date — 25 of 29. Sera and Bonnie are UNVERIFIED (no launch-roster
# source found); Leeho and Ellie rest on a single launch-era list.
# For launch-roster characters the date is the global launch,
# 2026-04-15 (Netmarble newsroom + Game8), with launch-roster
# membership evidenced by the second source named. Corrections vs
# the research file: Vivian released 2026-09-09 (not Sep 30);
# Brisshell arrived with v1.3 on 2026-08-20 (not launch).
# rarity / pool stay omitted: T2.8's verdict was PARTIAL (pool not
# two-source verified per character), so the Beginner page's reroll
# section stays off (plan D-3).

