# Source registry — as of the 2026-10-29 dataset.
# Source: docs/inputs/mongil-tier-list-consensus-2026-10-29.md and
# docs/inputs/mongil-consensus-math-proposal-v1.md §1.
# Status values are assigned by T2.3 in the live data; the fixture records
# the three voting sources as current and the rest by their standing role.

[[source]]
id = "pg"
name = "Pocket Gamer"
role = "voting"
kind = "per_mode"
url = "https://www.pocketgamer.com/mongil-star-dive/tier-list/"
list_date = "2026-10-05"
# The page states "1.04.00" — the App Store build string of the
# official 1.4 release (T2.3); mapped to the official string here.
game_version = "1.4"
status = "current"
criteria_caveat = "Conquest = boss, single target. Rift = dungeon, many enemies. World/Story list not used (the Summer variants aren't marked)."

[[source]]
id = "kaiden"
name = "Kaiden"
role = "voting"
kind = "overall_by_investment"
url = "https://www.kaiden.gg/mongil/characters/"
game_version = "1.4"
status = "current"
criteria_caveat = "Rates each character at Low, High and Max investment. Where a level has two tiers, we count the first one listed."
# T2.4: Kaiden's own definitions, published on its tier-list page
# (https://www.kaiden.gg/mongil/characters/tier-list/, "Ranking
# Criteria → Investment Views"), recorded verbatim in sweep
# 2026-10-29T2105-sweep-pm (kaiden-level-definitions.md).
level_definitions = { low = "Assumes accessible awakenings and limited signature weapon investment.", high = "Assumes higher awakenings and stronger signature weapon investment.", max = "Assumes full ascension, at A6, on every character ranked." }

