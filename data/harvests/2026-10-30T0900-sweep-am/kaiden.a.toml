# A-read (rendered text) — Kaiden per-character guide pages, sweep
# 2026-10-30T0900-sweep-am. One guide page per character; "Tier Position"
# section read for each. Pages fetched strictly sequentially,
# >=5s apart, starting 2026-10-30T08:58:24-04:00.
#
# Raw-line convention: the rendered text flattens the page's "(A#)", "(P)"
# and "(E)" markers into comma-separated tokens (e.g. "High Investment,
# T0.5, A4, High Investment, T1, A2"). `raw` below reconstructs the line in
# the §B.3 style ("T0.5 (A4), T1 at A2").
# `tier` is the first-listed tier on each level's part of the line
# (kaiden_conditional_rule = "first_listed").
#
# No individual guide page showed its own "updated" date in the rendered
# text, so `page_updated` is omitted throughout.

