# B-read (screenshot / visual) — Kaiden per-character guide pages, sweep
# 2026-10-29T2105-sweep-pm. Transcribed ONLY from
# B-READ-2-kaiden.md (browser visual read, 2026-10-29 ~21:11–21:16 ET);
# the A-read file was not consulted while transcribing.
#
# Conventions per docs/harvest-guide.md (Kaiden): `tier` is the
# first-listed tier on each level's line; `awakening` is the (A#) marker
# on the first-listed card; `flags` are the (P)/(E) markers appearing on
# that level's line (including on a second High card). `raw` preserves
# the B read's wording, including both High cards where two were shown.
#
# No guide page showed its own "updated" date in the visual read, so
# `page_updated` is omitted throughout. The tier-list page states
# "Tier List as of October 2026", last updated October 19, 2026, and
# "Showing all 28 characters" (Chloe unranked).

[meta]
source = "kaiden"
harvest = "2026-10-29T2105-sweep-pm"
worker = "B"
read_mode = "screenshot"
read_at = "2026-10-29T21:16:00-04:00"
note = "Tier-list page (kaiden.gg/mongil/characters/tier-list/) last updated October 19, 2026; shows all 28 characters (Chloe unranked). Definitions verbatim in B-READ-2-kaiden.md: Low = accessible awakenings and limited signature weapon investment; High = higher awakenings and stronger signature weapon investment; Max = full ascension, at A6, on every character ranked."

