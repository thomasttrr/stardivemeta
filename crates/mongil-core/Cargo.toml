[package]
name = "mongil-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mongil_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ts-rs = { version = "10", features = ["serde-compat"] }

[dev-dependencies]
proptest = "1"
